:root{--bg:#fff;--fg:#0f172a;--mut:#64748b;--card:#fff;--bd:#e2e8f0;--side:#f8fafc;--pri:#4338ca;--pb:#4f46e5;--ps:#eef2ff;--soft:#f1f5f9;--ok:#16a34a;--wn:#d97706;--bd2:#dc2626;--wb:#fffbeb;--gb:#f0fdf4;--pur:#8b5cf6}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg)}
button,input,textarea,select{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
aside{width:230px;flex:none;background:var(--side);border-right:1px solid var(--bd);padding:14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
aside nav{flex:1;margin:12px 0}
.nv{display:flex;gap:10px;align-items:center;width:100%;padding:7px 10px;border:0;background:none;border-radius:8px;font-weight:500;cursor:pointer;text-align:left;font-size:13px}
.nv:hover{background:var(--soft)}.nv.on{background:var(--ps);color:var(--pri)}
.nv i{margin-left:auto;background:var(--bd2);color:#fff;border-radius:9px;padding:0 7px;font-size:11px;font-style:normal}
.wrap{flex:1;min-width:0}
header{display:flex;gap:10px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:5}
main{padding:24px;max-width:1100px}
h1{font-size:22px;margin:0 0 6px}p.s{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.b{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--pb);background:var(--pb);color:#fff;border-radius:8px;padding:7px 14px;font-weight:500;cursor:pointer;font-size:13px}
.b.o{background:var(--card);color:var(--fg);border-color:var(--bd)}.b.o:hover{background:var(--soft)}
.b.g{background:var(--ok);border-color:var(--ok)}.b.r{background:var(--bd2);border-color:var(--bd2)}
.bg{display:inline-block;border:1px solid var(--bd);border-radius:99px;padding:2px 10px;font-size:11px;font-weight:600;margin-right:6px}
.ok{color:var(--ok);border-color:var(--ok)}.wn{color:var(--wn);border-color:var(--wn)}.bd{color:var(--bd2);border-color:var(--bd2)}.pr{color:var(--pri);border-color:var(--pri);background:var(--ps)}.pu{color:var(--pur);border-color:var(--pur);background:#f5f3ff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.stat .v{font-size:28px;font-weight:700;color:var(--pri);line-height:1.1}
.stat .l{font-size:12px;color:var(--mut);margin-top:4px}
.stat .h{font-size:11px;color:var(--ok);margin-top:6px;font-weight:500}
.banner{padding:14px 18px;border-radius:12px;margin-bottom:18px;border:1px solid}
.banner.hero{background:linear-gradient(135deg,#eef2ff,#f5f3ff);border-color:#c7d2fe}
.banner.warn{background:var(--wb);border-color:var(--wn);color:#78350f}
.banner.ok{background:var(--gb);border-color:var(--ok);color:#14532d}
.m{color:var(--mut);font-size:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--bd)}
th{font-size:12px;color:var(--mut);font-weight:600;background:var(--soft)}
.tabs{display:inline-flex;background:var(--soft);border-radius:8px;padding:3px;margin-bottom:16px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px}
.tabs .on{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.chip{padding:6px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);font-size:13px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--pb)}
.src{background:var(--soft);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:13px;cursor:pointer}
.src .full{display:none;margin-top:6px;padding-top:6px;border-top:1px dashed var(--bd);color:var(--mut)}
.src.open .full{display:block}
.src:hover{background:var(--bd)}
.path{display:flex;flex-direction:column;gap:8px;background:var(--soft);border-radius:10px;padding:12px;margin:10px 0;font-size:13px}
.path .step{display:flex;gap:10px;align-items:center}
.path .step .n{background:var(--pri);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.path .step .r{color:var(--mut);font-size:11px;font-style:italic}
.signal{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:10px 0}
.signal>div{background:var(--soft);border-radius:8px;padding:10px;font-size:12px}
.signal .v{font-weight:700;font-size:16px;margin-bottom:2px}
.signal .ok{color:var(--ok)}.signal .wn{color:var(--wn)}.signal .bd{color:var(--bd2)}
.hm{display:grid;grid-template-columns:120px repeat(6,1fr);gap:2px;font-size:11px}
.hm .h{font-weight:600;padding:6px 4px;text-align:center;color:var(--mut)}
.hm .l{padding:6px 4px;font-weight:500}
.hm .c{padding:8px 4px;text-align:center;border-radius:4px;color:#fff;font-size:10px;font-weight:600}
.env{display:inline-flex;gap:6px;align-items:center;font-size:11px;color:var(--mut);padding:3px 8px;border:1px solid var(--bd);border-radius:99px;background:var(--card)}

.demo-pill{background:linear-gradient(90deg,var(--pb),var(--pur));color:#fff;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:600}
.thread{display:flex;flex-direction:column;gap:16px}
.turn-q{color:var(--mut);font-weight:500;font-size:12px;margin-bottom:4px}
.turn-q b{color:var(--fg)}
.empty{border:1px dashed var(--bd);border-radius:12px;padding:30px;text-align:center;color:var(--mut)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin:10px 0}
.legend span{padding:3px 8px;border-radius:6px;background:var(--soft);color:#fff;font-weight:600}
details.card summary{cursor:pointer;font-weight:600}
@media(max-width:767px){aside{display:none}main{padding:14px}}

// ============ RENDER HELPERS ============
function confidenceBadge(c){
  if(c>=.7)return`<span class="bg ok">🟢 High · ${Math.round(c*100)}%</span>`;
  if(c>=.4)return`<span class="bg wn">🟡 Medium · ${Math.round(c*100)}%</span>`;
  return`<span class="bg bd">🔴 Low · ${Math.round(c*100)}%</span>`;
}

function renderChatTurn(t,i){
  return `<div>
    <div class="turn-q">You asked: <b>${esc(t.q)}</b></div>
    <div class="card">
      ${t.triedBefore?`<div class="banner warn">⚠️ <b>Tried before:</b> ${esc(t.triedBefore)}</div>`:""}
      ${confidenceBadge(t.conf)}
      <span class="bg pu">${t.sys}</span>
      <div style="white-space:pre-line;margin:12px 0">${esc(t.a)}</div>

      <div style="font-weight:600;margin-top:14px">Sources (${t.sources.length})</div>
      ${t.sources.map((s,ci)=>{const oi=S.citeOpen===i+"-"+ci;return `<div class="src ${oi?"open":""}" onclick="toggleCite('${i}-${ci}')">📄 <b>${esc(s[0])}</b>${s[2]?' <span class="bg bd" style="font-size:10px">private</span>':''} — ${esc(s[1])}<div class="full"><b>Full text:</b> ${esc(s[1])}</div></div>`}).join("")}

      <details style="margin-top:12px" ${i===1?"open":""}>
        <summary style="cursor:pointer;font-weight:600;font-size:13px">🕸️ Why this answer? (multi-hop reasoning path)</summary>
        <div class="path">
          ${t.graphPath.map((p,pi)=>`<div class="step"><div class="n">${pi+1}</div><div><b>${esc(p[0])}</b> → ${esc(p[1])}<div class="r">${esc(p[2])}</div></div></div>`).join("")}
        </div>
        <div class="signal">
          <div><div class="v ok">${t.signals.retrieval}</div>Retrieval score</div>
          <div><div class="v ok">${t.signals.llm}</div>LLM self-check</div>
          <div><div class="v ok">${t.signals.graph}</div>Graph coverage</div>
        </div>
        <div class="m">Confidence = combination of 3 signals. Escalates to expert when 2 of 3 are weak.</div>
      </details>

      <div class="row" style="margin-top:14px;border-top:1px solid var(--bd);padding-top:12px">
        <button type="button" class="b o" onclick="giveFeedback(${i},'Helpful')">👍 Helpful</button>
        <button type="button" class="b o" onclick="giveFeedback(${i},'Not helpful')">👎 Not helpful</button>
        <button type="button" class="b" onclick="saveChatMemory(${i})">💾 Save to memory</button>
      </div>
    </div>
  </div>`;
}

function renderGraph(){
  const svgW=850,svgH=380;
  const pos={};
  ["Person","Project","Client","Problem","Solution","Decision"].forEach((cat,ci)=>{
    GRAPH.nodes.filter(n=>n.t===cat).forEach((n,ri)=>{
      pos[n.id]=[80+ci*135,40+ri*55];
    });
  });
  const edges=GRAPH.edges.map((e,i)=>{
    const a=pos[e[0]],b=pos[e[1]];
    const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2-18;
    const hl=S.selectedNode&&(S.selectedNode===e[0]||S.selectedNode===e[1]);
    return `<path d="M ${a[0]} ${a[1]} Q ${mx} ${my} ${b[0]} ${b[1]}" stroke="${hl?"var(--pb)":"#cbd5e1"}" stroke-width="${hl?2.5:1.2}" fill="none" marker-end="url(#ar${i})" opacity="${S.selectedNode&&!hl?0.15:0.7}"/>
    <defs><marker id="ar${i}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="${hl?"#4f46e5":"#cbd5e1"}"/></marker></defs>`;
  }).join("");
  const nodes=GRAPH.nodes.map(n=>{
    const p=pos[n.id];
    const hl=S.selectedNode===n.id;
    const dim=S.selectedNode&&!hl&&!GRAPH.edges.some(e=>e[0]===S.selectedNode&&e[1]===n.id||e[1]===S.selectedNode&&e[0]===n.id);
    return `<g style="cursor:pointer;opacity:${dim?0.15:1}" onclick="selectNode('${n.id}')">
      <rect x="${p[0]-52}" y="${p[1]-15}" width="104" height="30" rx="8" fill="${TC[n.t]}" stroke="${hl?"#0f172a":"none"}" stroke-width="3"/>
      <text x="${p[0]}" y="${p[1]+4}" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">${esc(n.l)}</text>
    </g>`;
  }).join("");
  const sel=GRAPH.nodes.find(n=>n.id===S.selectedNode);
  const conns=sel?GRAPH.edges.filter(e=>e[0]===sel.id||e[1]===sel.id).map(e=>{
    const other=e[0]===sel.id?e[1]:e[0];const dir=e[0]===sel.id?"→":"←";
    const on=GRAPH.nodes.find(n=>n.id===other);
    return `<div style="padding:6px 0;font-size:13px">${dir} <span class="m">${e[2]}</span> <b>${on.l}</b></div>`;
  }).join(""):"";
  return `<h1>🕸️ Knowledge Graph</h1>
  <p class="s">Every decision, problem, and solution is a node. Every relationship is an edge. The graph is what lets us answer multi-hop questions that plain search cannot.</p>
  <div class="legend">${Object.keys(TC).map(t=>`<span style="background:${TC[t]}">${t}</span>`).join("")}</div>
  <div style="display:grid;grid-template-columns:1fr 260px;gap:14px">
    <div class="card" style="padding:8px;overflow:auto">
      <svg viewBox="0 0 ${svgW} ${svgH}" style="width:100%;min-width:760px">
        ${edges}${nodes}
      </svg>
    </div>
    <div class="card" style="height:fit-content">
      ${sel?`<b style="font-size:16px">${esc(sel.l)}</b><div style="margin:6px 0"><span class="bg" style="background:${TC[sel.t]};color:#fff;border:0">${sel.t}</span></div>
      <div style="font-weight:600;font-size:12px;margin-top:14px;color:var(--mut)">CONNECTIONS (${GRAPH.edges.filter(e=>e[0]===sel.id||e[1]===sel.id).length})</div>
      ${conns}`:`<div class="m">Click any node to inspect its connections.</div>`}
    </div>
  </div>`;
}

      2026-10-24 11:05 · Priya Sharma · marked outdated "Manufacturing Co pricing 2023"
      </div>
    </div>
  `}`;
}

function renderRunbook(){
  const generated=S.runbookGenerated;
  return `<h1>🔧 Runbook Generator</h1>
  <p class="s">Describe an incident. Nova builds a runbook from real past tickets and approved solutions.</p>
  <textarea id="runbookInput" style="width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px" rows="3" placeholder="e.g., server restarts every night at 2am">${esc(S.runbookText)}</textarea>
  <button type="button" class="b" style="margin-top:10px" onclick="generateRunbook()">✨ Generate runbook</button>
  ${generated?`<div class="card" style="margin-top:16px">
    <b>📋 Generated Runbook — ${esc(S.runbookText)}</b>
    <div style="margin-top:10px"><span class="bg bd">High</span> <span class="m">Based on 3 incidents · 5 tickets · 2 solutions</span></div>
    <ol style="line-height:1.9;margin-top:10px">
      <li>Check Redis memory usage on the application server.</li>
      <li>Inspect session queue size before the nightly backup window.</li>
      <li>Clear the Redis session queue.</li>
      <li>Restart the backup job and confirm it completes.</li>
      <li>Record the outcome and tag the incident.</li>
    </ol>
    <div class="m" style="margin-top:12px"><b>Sources:</b> tickets/ticket_retailcorp_jan2025.json · runbooks/redis_session_queue.md · post_mortems/pm_crm_retailcorp.md</div>
    <div class="row" style="margin-top:12px">
      <button type="button" class="b" onclick="toast('Runbook saved to memory')">💾 Save runbook</button>
      <button type="button" class="b o" onclick="copyRunbook()">📋 Copy</button>
    </div>
  </div>`:""}`;
}

function renderOnboarding(){
  const items=[
    ["What does Nova Consulting do?","IT and management consulting. We help clients migrate legacy systems to the cloud, meet compliance (GDPR, healthcare), build Kubernetes platforms, and ship ML products. Teams: Pre-Sales, Delivery, Support.","hr/company_overview.md"],
    ["How are teams organised?","Pre-Sales wins deals. Delivery builds projects. Support keeps clients running. Expert routing routes between them.","hr/company_overview.md"],
    ["Where do I find past proposals?","Ask the Memory Agent. It searches all past proposals and cites the source. Pricing is visible only to Pre-Sales and Admin.","hr/onboarding.md"],
    ["What should I do in my first week?","Meet your team lead. Read two past project post-mortems in your area. Ask the agent one real question. Read the 3 most-cited ADRs.","hr/onboarding.md"],
    ["Who do I ask when I'm stuck?","Ask the Memory Agent first. If it says it doesn't know, it will suggest the right expert. Reply to that expert in the Expert Inbox.","hr/onboarding.md"],

// ============ ROUTER ============
const VIEWS={
  landing:renderLanding,
  chat:renderChat,
  memory:renderMemory,
  graph:renderGraph,
  timeline:renderTimeline,
  eval:renderEval,
  experts:renderExperts,
  review:renderReview,
  admin:renderAdmin,
  runbook:renderRunbook,
  onboarding:renderOnboarding
};

function render(){
  $("#root").innerHTML=`<div class="app">
    <aside>
      <div style="font-size:16px;font-weight:700;margin-bottom:4px">🧠 Nova</div>
      <div class="m" style="margin-bottom:10px">Semester 2 · final view</div>
      <div class="demo-pill" style="margin-bottom:12px">Mockup — click any screen</div>
      <nav>${NAV.map(n=>`<button class="nv ${S.view===n[0]?"on":""}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join("")}</nav>
      <div style="font-size:11px;color:var(--mut);padding-top:12px;border-top:1px solid var(--bd);line-height:1.7">
        <div>🐳 Docker · deployed</div>
        <div>🟢 Neo4j · 342 nodes</div>
        <div>🟢 Chroma · 1,847 chunks</div>
        <div>🔗 API · /docs</div>
      </div>
    </aside>
    <div class="wrap">
      <header>
        <span style="font-size:13px;color:var(--mut)">Logged in as <b style="color:var(--fg)">Admin</b> · viewing all teams</span>
        <span class="env" style="margin-left:auto"><span class="dot"></span>prod</span>
      </header>
      <main>${(VIEWS[S.view]||renderLanding)()}</main>
    </div>
  </div>`;
}

function go(v){S.view=v;render()}
function toggleCite(k){S.citeOpen=S.citeOpen===k?null:k;render()}
function selectNode(id){S.selectedNode=S.selectedNode===id?null:id;render()}
function setEvalTab(t){S.evalTab=t;render()}
function setAdminTab(t){S.adminTab=t;render()}
function toast(m){alert(m)}

function askQuestion(q){
  const known=CHAT_THREAD.find(t=>t.q===q);
  const answer=known?{
    ...known,
    sources:known.sources.map(s=>s.slice()),
    graphPath:known.graphPath.map(p=>p.slice()),
    signals:{...known.signals}
  }:{
    q,
    a:"I could not find an approved answer for that question in this demo. The best next step is to route it to a subject-matter expert.",
    conf:.32,
    sys:"Local demo search",
    mem:false,
    sources:[["expert_inbox","No approved source matched this question.",false]],
    graphPath:[["Question",q,"user query"],["Expert Inbox","Needs human follow-up","no approved answer found"]],
    signals:{retrieval:"0.32 low",llm:"not used",graph:"no matching path"}
  };
  S.chatTurns.push(answer);
  S.chatInput="";
  render();
}

function submitChat(event){
  event.preventDefault();
  const input=$("#chatInput");
  const question=input?input.value.trim():"";
  if(!question){toast("Enter a question first.");return}
  askQuestion(question);
}

function giveFeedback(index,feedback){
  toast(`${feedback} feedback recorded for this demo answer.`);
}

function saveChatMemory(index){
  toast("Answer saved to memory for this demo.");
}

function reviewFact(index,status){
  S.reviewStatus[index]=status;
  render();
  toast(status==="approved"?"Fact approved — will enter memory.":"Fact rejected.");
}

function reviewAll(status){
  REVIEW.forEach((r,index)=>{
    if(!S.reviewSearch||r.text.toLowerCase().includes(S.reviewSearch.toLowerCase()))S.reviewStatus[index]=status;
  });
  render();
  toast(status==="approved"?"All shown facts approved.":"All shown facts rejected.");
}

function editFact(index){
  const updated=prompt("Edit this fact:",REVIEW[index].text);
  if(updated===null)return;
  const text=updated.trim();
  if(!text){toast("Fact text cannot be empty.");return}
  REVIEW[index].text=text;
  S.reviewStatus[index]="pending";
  render();
  toast("Fact updated.");
}

function generateRunbook(){
  const input=$("#runbookInput");
  const text=input?input.value.trim():"";
  if(!text){toast("Describe an incident first.");return}
  S.runbookText=text;
  S.runbookGenerated=true;
  render();
}

function copyRunbook(){
  const text="Runbook: "+S.runbookText+"\n\n1. Check the affected service and recent logs.\n2. Inspect resource usage before the incident window.\n3. Apply the approved mitigation.\n4. Confirm recovery and record the outcome.";
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast("Runbook copied.")).catch(()=>toast("Copy was blocked by the browser. Select the runbook text to copy it."));
    return;
  }
  const area=document.createElement("textarea");
  area.value=text;
  area.style.position="fixed";
  area.style.opacity="0";
  document.body.appendChild(area);
  area.select();
  const copied=document.execCommand("copy");
  area.remove();
  toast(copied?"Runbook copied.":"Copy was blocked by the browser. Select the runbook text to copy it.");
}

render();
</script>
